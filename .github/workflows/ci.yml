name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/dependency-wheelhouse
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  checks:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The oldest interpreter the package supports, so that a construct
          # introduced later is caught here rather than by a user on 3.10.
          python-version: "3.10"
      - uses: ./.github/actions/dependency-wheelhouse
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy

  example:
    name: The worked example reproduces its published figures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/dependency-wheelhouse
      - name: Build and install the wheel
        # Against the built artefact rather than the source tree, so a file
        # left out of the package is caught here and not by the first person
        # to install it.
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          pip install dist/*.whl
      - name: The command runs and prints the table
        run: |
          paper-to-live run | tee /tmp/table.txt
          grep -q "WHERE THE SHARPE RATIO WENT" /tmp/table.txt
          grep -q "Surviving" /tmp/table.txt
      - name: Every figure is valid JSON with nothing non-finite in it
        run: |
          paper-to-live run --json > /tmp/figures.json
          python -c "import json; json.loads(open('/tmp/figures.json').read())"
          python -c "
          import json
          json.dumps(json.load(open('/tmp/figures.json')), allow_nan=False)
          "
      - name: Help renders for every command
        # A literal per cent sign in a help string is a conversion specifier
        # and raises only when help is rendered, which the commands never do.
        run: |
          paper-to-live --help > /dev/null
          paper-to-live run --help > /dev/null
